name: App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Java Services ──────────────────────────────────────────
  test-java:
    name: Test Java (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [command-api]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build and Test ${{ matrix.service }}
        run: mvn verify --no-transfer-progress -Dstyle.color=always
        working-directory: services/${{ matrix.service }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/

  # ── TypeScript Lambda Workers ───────────────────────────────
  test-typescript:
    name: Test TypeScript Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Lint
        run: npm run lint --if-present

  # ── Static Analysis ─────────────────────────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: SpotBugs + Checkstyle
        run: mvn spotbugs:check checkstyle:check --no-transfer-progress
        working-directory: services/command-api
        continue-on-error: true   # Warn but don't block on initial setup

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npm run build

  # ── Secret Scanning ─────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── Docker Build Validation ──────────────────────────────────
  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [command-api]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: hermes-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
