name: Deploy — Dev

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-lambda-workers:
    name: Deploy Lambda Workers
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_DEV }}
          aws-region: us-east-1

      - name: Package and deploy Lambda workers
        run: ./scripts/deploy-lambdas.sh dev
        env:
          ENVIRONMENT: dev
          AWS_REGION: us-east-1

  deploy-command-api:
    name: Deploy command-api (ECS)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'maven'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_DEV }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/hermes-command-api:$IMAGE_TAG services/command-api
          docker push $ECR_REGISTRY/hermes-command-api:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/hermes-command-api:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update ECS service
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs update-service \
            --cluster hermes-dev \
            --service hermes-dev-command-api \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster hermes-dev \
            --services hermes-dev-command-api
