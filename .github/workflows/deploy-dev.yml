name: Deploy — Dev

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-lambdas:
    name: Deploy Lambda Workers
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ap-south-1

      - name: Bundle Lambda packages
        run: ./scripts/bundle-lambdas.sh

      - name: Deploy Lambda workers
        run: ./scripts/deploy-lambdas.sh dev
        env:
          ENVIRONMENT: dev
          AWS_REGION: ap-south-1
