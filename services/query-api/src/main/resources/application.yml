server:
  port: 8081

spring:
  application:
    name: hermes-query-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_placeholder}

hermes:
  read-model:
    table-name: ${EXECUTION_READ_MODEL_TABLE:hermes-dev-execution-read-model}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.hermes: INFO
